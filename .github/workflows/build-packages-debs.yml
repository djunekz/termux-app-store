name: Build Package .deb Files

permissions:
  contents: read

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package spesifik (kosong = build semua yang berubah)'
        required: false
        default: ''
      force:
        description: 'Force rebuild (ignore cache)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  quality:
    name: Lint, Type Check and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Run tests
        run: pytest

  detect-changes:
    name: Detect Packages to Build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_packages: ${{ steps.detect.outputs.has_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Detect packages to build
        id: detect
        env:
          SPECIFIC_INPUT: ${{ github.event.inputs.package }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
          TRIGGER_INPUT: ${{ github.event_name }}
        run: |
          SPECIFIC="$SPECIFIC_INPUT"
          FORCE="$FORCE_INPUT"
          TRIGGER="$TRIGGER_INPUT"

          if [[ -n "$SPECIFIC" ]]; then
            PKGS=$(echo "$SPECIFIC" | tr ',' ' ')
            for _pkg in $PKGS; do
              [[ -f "packages/$_pkg/build.sh" ]] || { echo "Package '$_pkg' not found"; exit 1; }
            done
          elif [[ "$FORCE" == "true" || "$TRIGGER" == "schedule" ]]; then
            PKGS=$(ls packages/ 2>/dev/null | tr '\n' ' ')
          else
            PKGS=$(python3 -c "
          import json, subprocess
          try:
              old = {p['package']:(p.get('version',''), p.get('recipe_sha256','')) for p in json.loads(subprocess.check_output(['git','show','HEAD~1:tools/index.json'],stderr=subprocess.DEVNULL).decode()).get('packages',[])}
          except (subprocess.CalledProcessError, ValueError):
              old = {}
          new = {p['package']:(p.get('version',''), p.get('recipe_sha256','')) for p in json.load(open('tools/index.json')).get('packages',[])}
          changed = []
          for pkg, (ver, rec) in new.items():
              prev = old.get(pkg)
              if prev is None or prev[0] != ver or (prev[1] and prev[1] != rec):
                  changed.append(pkg)
          print(' '.join(changed))
          " || echo "")
          fi

          if [[ -z "$(echo $PKGS | tr -d ' ')" ]]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATRIX_ITEMS=""
          for pkg in $PKGS; do
            [[ -f "packages/$pkg/build.sh" ]] || continue
            VERSION=$(grep 'TERMUX_PKG_VERSION=' "packages/$pkg/build.sh" | head -1 | cut -d= -f2 | tr -d "\"'" 2>/dev/null || echo "unknown")
            SHA256=$(grep 'TERMUX_PKG_SHA256=' "packages/$pkg/build.sh" | head -1 | cut -d= -f2 | tr -d "\"'" 2>/dev/null || echo "")
            SHA256="${SHA256,,}"
            [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || SHA256=""
            RECIPE=$(sha256sum "packages/$pkg/build.sh" | cut -d' ' -f1)
            SRCURL=$(grep 'TERMUX_PKG_SRCURL=' "packages/$pkg/build.sh" | head -1 | cut -d= -f2- | tr -d "\"'" | sed "s|\${TERMUX_PKG_VERSION}|$VERSION|g" 2>/dev/null || echo "")
            VERSION_RE='^[A-Za-z0-9][A-Za-z0-9.+~:-]*$'
            URL_RE='^[A-Za-z0-9:/._~%@+=?&,#-]*$'
            PKG_RE='^[A-Za-z0-9][A-Za-z0-9._+-]*$'
            if [[ ! "$pkg" =~ $PKG_RE || ! "$VERSION" =~ $VERSION_RE || ! "$SRCURL" =~ $URL_RE ]]; then
              echo "ERROR: unsafe or malformed metadata in packages/$pkg/build.sh"
              exit 1
            fi
            IS_PREBUILT_DEB=false
            if echo "$SRCURL" | grep -q '\.deb$'; then IS_PREBUILT_DEB=true; fi
            [[ -n "$MATRIX_ITEMS" ]] && MATRIX_ITEMS="$MATRIX_ITEMS,"
            MATRIX_ITEMS="${MATRIX_ITEMS}{\"package\":\"$pkg\",\"version\":\"$VERSION\",\"sha256\":\"$SHA256\",\"recipe\":\"$RECIPE\",\"is_prebuilt_deb\":\"$IS_PREBUILT_DEB\",\"srcurl\":\"$SRCURL\"}"
          done

          echo "matrix={\"include\":[$MATRIX_ITEMS]}" >> "$GITHUB_OUTPUT"
          echo "has_packages=true" >> "$GITHUB_OUTPUT"

  build-deb:
    name: Build ${{ matrix.package }} v${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_packages == 'true'
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check binary cache
        id: cache
        if: github.event.inputs.force != 'true'
        uses: actions/cache@v6
        with:
          path: output/
          key: pkg-${{ matrix.package }}-${{ matrix.version }}-${{ matrix.recipe }}-${{ matrix.sha256 }}

      - name: Repack prebuilt .deb (no Docker needed)
        if: |
          matrix.is_prebuilt_deb == 'true' &&
          (github.event.inputs.force == 'true' || steps.cache.outputs.cache-hit != 'true')
        env:
          PKG: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
          SRCURL: ${{ matrix.srcurl }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          [[ "$PKG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || { echo "Invalid package name"; exit 1; }
          mkdir -p output

          echo "=== Downloading prebuilt .deb ==="
          echo "URL: $SRCURL"
          curl -fsSL "$SRCURL" -o "source.deb" || {
            echo "ERROR: Download failed"
            exit 1
          }

          SHA256="${SHA256,,}"
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: a full 64-character SHA256 is required for a prebuilt .deb"
            exit 1
          fi
          GOTSUM=$(sha256sum source.deb | cut -d' ' -f1)
          if [[ "$GOTSUM" == "$SHA256" ]]; then
            echo "Checksum OK"
          else
            echo "ERROR: checksum mismatch (expected: $SHA256, got: $GOTSUM)"
            exit 1
          fi

          echo "=== Extracting .deb ==="
          TMPDIR_EXTRACT="repack_src"
          mkdir -p "$TMPDIR_EXTRACT"
          dpkg-deb -x source.deb "$TMPDIR_EXTRACT/"
          dpkg-deb -e source.deb "$TMPDIR_EXTRACT/DEBIAN"

          BUILD_SH="packages/$PKG/build.sh"
          HAS_CUSTOM_INSTALL=false
          if grep -q 'termux_step_make_install' "$BUILD_SH" 2>/dev/null; then
            HAS_CUSTOM_INSTALL=true
          fi

          if [[ "$HAS_CUSTOM_INSTALL" == "true" ]]; then
            echo "=== Custom termux_step_make_install() detected — applying ==="
            STAGING="repack_staged"
            mkdir -p "$STAGING"
            PREFIX_ORIG="/data/data/com.termux/files/usr"

            export TERMUX_PREFIX="$PWD/$STAGING$PREFIX_ORIG"
            export TERMUX_PKG_SRCDIR="$PWD/$TMPDIR_EXTRACT"
            mkdir -p "$TERMUX_PREFIX/bin" "$TERMUX_PREFIX/lib/$PKG"

            source "$BUILD_SH"
            if declare -f termux_step_make_install > /dev/null 2>&1; then
              (cd "$TERMUX_PKG_SRCDIR" && termux_step_make_install)
            fi

            mkdir -p "repack_final"
            cp -r "$TMPDIR_EXTRACT/." "repack_final/"
            if [[ -d "$STAGING$PREFIX_ORIG" ]]; then
              mkdir -p "repack_final$PREFIX_ORIG"
              cp -r "$STAGING$PREFIX_ORIG/." "repack_final$PREFIX_ORIG/"
            fi

            mkdir -p "repack_final/DEBIAN"
            cp "$TMPDIR_EXTRACT/DEBIAN/"* "repack_final/DEBIAN/"
            sed -i "s/^Architecture:.*/Architecture: aarch64/" "repack_final/DEBIAN/control"

            echo "=== Contents after custom install ==="
            find repack_final -not -path "*/DEBIAN/*" -type f | sed 's|^repack_final||'

            dpkg-deb --build "repack_final" "output/${PKG}_${VERSION}_aarch64.deb"

          else
            echo "=== No custom install — repack as-is for aarch64 ==="
            sed -i "s/^Architecture:.*/Architecture: aarch64/" "$TMPDIR_EXTRACT/DEBIAN/control"
            dpkg-deb --build "$TMPDIR_EXTRACT" "output/${PKG}_${VERSION}_aarch64.deb"
          fi

          echo "=== Verifying output ==="
          DEB_OUT="output/${PKG}_${VERSION}_aarch64.deb"
          if [[ -f "$DEB_OUT" ]]; then
            echo "OK: $DEB_OUT"
            TMPV=$(mktemp -d)
            dpkg-deb -x "$DEB_OUT" "$TMPV/"
            echo "Contents:"
            find "$TMPV" -type f | sed "s|$TMPV||"
            rm -rf "$TMPV"
          else
            echo "ERROR: .deb not produced"
            exit 1
          fi

      - name: Set up QEMU for aarch64 emulation
        if: |
          matrix.is_prebuilt_deb != 'true' &&
          (github.event.inputs.force == 'true' || steps.cache.outputs.cache-hit != 'true')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
        with:
          platforms: arm64

      - name: Build .deb inside termux-docker (aarch64)
        if: |
          matrix.is_prebuilt_deb != 'true' &&
          (github.event.inputs.force == 'true' || steps.cache.outputs.cache-hit != 'true')
        env:
          MATRIX_PKG: ${{ matrix.package }}
        run: |
          [[ "$MATRIX_PKG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || { echo "Invalid package name"; exit 1; }
          mkdir -p output

          WORK_DIR=$(mktemp -d)
          chmod 777 "$WORK_DIR"
          cp -r . "$WORK_DIR/"
          chmod -R 777 "$WORK_DIR"
          mkdir -p "$WORK_DIR/output"

          PKG_DEPS=$(grep 'TERMUX_PKG_DEPENDS=' "packages/$MATRIX_PKG/build.sh" | head -1 \
            | cut -d= -f2 | tr -d "\"'" | tr ',' ' ' | xargs 2>/dev/null || true)
          PKG_DEPS=$(printf '%s' "$PKG_DEPS" | tr -cd 'A-Za-z0-9._+ -')

          printf '%s' "$MATRIX_PKG" > "$WORK_DIR/.tas_pkg_name"
          printf '%s' "$PKG_DEPS" > "$WORK_DIR/.tas_pkg_deps"
          chmod 644 "$WORK_DIR/.tas_pkg_name" "$WORK_DIR/.tas_pkg_deps"

          trap 'sudo rm -rf "$WORK_DIR" 2>/dev/null || rm -rf "$WORK_DIR" 2>/dev/null || true' EXIT

          docker run --rm \
            --platform linux/arm64 \
            -v "$WORK_DIR:/opt/tas" \
            termux/termux-docker:aarch64 \
            bash -c '
              export PREFIX=/data/data/com.termux/files/usr
              export PATH="$PREFIX/bin:$PATH"
              export TERM=xterm-256color
              mkdir -p "$PREFIX/tmp"
              export TMPDIR="$PREFIX/tmp"

              export HOME=/data/data/com.termux/files/home
              if ! mkdir -p "$HOME" 2>/dev/null || [[ ! -w "$HOME" ]]; then
                export HOME="$(mktemp -d)"
              fi
              echo "=== Running as $(id -un) with HOME=$HOME ==="

              cd /opt/tas
              PKG=$(cat /opt/tas/.tas_pkg_name)
              PKG_DEPS=$(cat /opt/tas/.tas_pkg_deps)

              if [[ -z "$PKG" ]]; then
                echo "ERROR: package name was not passed into the container"
                exit 1
              fi

              echo "=== Updating pkg ==="
              for attempt in 1 2 3 4 5; do
                pkg update -y -o Acquire::Retries=5 -o Dpkg::Options::="--force-confnew" && break
                echo "WARNING: pkg update attempt $attempt failed"
                rm -rf "${PREFIX:?}/var/lib/apt/lists/"* 2>/dev/null || true
                sleep $(( attempt * 15 + RANDOM % 10 ))
              done

              echo "=== Installing baseline build tools ==="
              pkg install -y -o Acquire::Retries=5 make clang binutils 2>&1 || echo "WARNING: baseline build tools could not be installed"

              if [[ -n "$PKG_DEPS" ]]; then
                echo "=== Pre-installing dependencies: $PKG_DEPS ==="
                for dep in $PKG_DEPS; do
                  dep_ok=false
                  for attempt in 1 2 3 4 5; do
                    if pkg install -y -o Acquire::Retries=5 "$dep" 2>&1; then
                      dep_ok=true
                      break
                    fi
                    echo "WARNING: attempt $attempt to install $dep failed"
                    rm -rf "${PREFIX:?}/var/lib/apt/lists/"* 2>/dev/null || true
                    sleep $(( attempt * 20 + RANDOM % 15 ))
                    pkg update -y -o Acquire::Retries=5 >/dev/null 2>&1 || true
                  done
                  if [[ "$dep_ok" != true ]]; then
                    echo "ERROR: could not install dependency: $dep"
                    exit 1
                  fi
                done
              fi

              echo "=== Building $PKG ==="
              BUILD_EXIT=0
              bash build-package.sh "$PKG" 2>&1 || BUILD_EXIT=$?

              echo "=== Output ==="
              ls -lh output/ 2>/dev/null || echo "(no output)"

              exit $BUILD_EXIT
            '

          shopt -s nullglob
          built_debs=("$WORK_DIR"/output/*.deb)
          if [[ ${#built_debs[@]} -eq 0 ]]; then
            echo "ERROR: the build produced no .deb"
            exit 1
          fi
          cp "${built_debs[@]}" output/

      - name: Repackage for all architectures
        if: github.event.inputs.force == 'true' || steps.cache.outputs.cache-hit != 'true'
        env:
          PKG: ${{ matrix.package }}
          MATRIX_VERSION: ${{ matrix.version }}
        run: |
          [[ "$PKG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || { echo "Invalid package name"; exit 1; }
          BUILT=$(ls output/${PKG}_*_aarch64.deb 2>/dev/null | head -1)

          if [[ -z "$BUILT" ]]; then
            echo "ERROR: no aarch64 .deb found in output/"
            exit 1
          fi

          BUILT_VERSION=$(dpkg-deb -f "$BUILT" Version 2>/dev/null || echo "$MATRIX_VERSION")
          echo "Repackaging from: $(basename $BUILT) (v$BUILT_VERSION)"

          TMPCHECK="repack_tmp/${PKG}_check"
          mkdir -p "$TMPCHECK"
          dpkg-deb -x "$BUILT" "$TMPCHECK/"

          HAS_ELF=false
          while IFS= read -r -d '' f; do
            magic=$(file -b "$f" 2>/dev/null || true)
            if echo "$magic" | grep -qi "^ELF"; then
              echo "  [ELF detected] $(basename $f) — skipping multi-arch repackage"
              HAS_ELF=true
              break
            fi
          done < <(find "$TMPCHECK" -type f -not -path "*/DEBIAN/*" -print0)
          rm -rf "$TMPCHECK"

          if [[ "$HAS_ELF" == "true" ]]; then
            echo "  Package contains ELF binary — only aarch64 .deb will be published"
            ls -lh output/ || true
            exit 0
          fi

          echo "  No ELF binaries — safe to repackage for all architectures"
          for ARCH in arm x86_64 i686; do
            TARGET="output/${PKG}_${BUILT_VERSION}_${ARCH}.deb"
            [[ -f "$TARGET" ]] && { echo "  [$ARCH] already exists"; continue; }
            TMPDIR_ARCH="repack_tmp/${PKG}_${ARCH}"
            mkdir -p "$TMPDIR_ARCH"
            dpkg-deb -x "$BUILT" "$TMPDIR_ARCH/"
            dpkg-deb -e "$BUILT" "$TMPDIR_ARCH/DEBIAN"
            sed -i "s/^Architecture:.*/Architecture: $ARCH/" "$TMPDIR_ARCH/DEBIAN/control"
            dpkg-deb --build "$TMPDIR_ARCH" "$TARGET" > /dev/null || { echo "  [$ARCH] FAIL"; exit 1; }
            echo "  [$ARCH] OK: $(basename $TARGET)"
            rm -rf "$TMPDIR_ARCH"
          done
          ls -lh output/ || true

      - name: Generate SHA256 checksums
        run: |
          mkdir -p output
          cd output
          shopt -s nullglob
          debs=(*.deb)
          if [[ ${#debs[@]} -eq 0 ]]; then
            echo "ERROR: no .deb files to checksum"
            exit 1
          fi
          for f in "${debs[@]}"; do
            sha256sum "$f" > "${f}.sha256"
            echo "  $(sha256sum $f | cut -c1-16)...  $f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deb-${{ matrix.package }}-${{ matrix.version }}
          path: |
            output/*.deb
            output/*.sha256
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish .deb to gh-pages
    runs-on: ubuntu-latest
    needs: [detect-changes, build-deb]
    permissions:
      contents: write
    if: |
      always() &&
      needs.detect-changes.outputs.has_packages == 'true' &&
      needs.build-deb.result != 'cancelled'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install tools
        run: sudo apt-get install -y -qq dpkg-dev python3 gnupg gpgv

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: deb-*
          path: all-debs/
          merge-multiple: true

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Initialize gh-pages if missing
        run: |
          if [[ ! -d "gh-pages/.git" ]]; then
            mkdir -p gh-pages && cd gh-pages
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout --orphan gh-pages
          fi
          mkdir -p gh-pages/pool/main
          for arch in aarch64 arm x86_64 i686; do
            mkdir -p "gh-pages/dists/termux/main/binary-${arch}"
          done

      - name: Replace pool entries of rebuilt packages (force rebuild only)
        if: github.event.inputs.force == 'true'
        run: |
          shopt -s nullglob
          declare -A rebuilt=()
          for deb in all-debs/*.deb; do
            fname=$(basename "$deb")
            PKG=$(echo "$fname" | sed 's/_[^_]*_[^_]*\.deb$//')
            if [[ ! "$PKG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
              echo "Invalid package name: $PKG" >&2
              exit 1
            fi
            rebuilt["$PKG"]=1
          done
          for PKG in "${!rebuilt[@]}"; do
            rm -f "gh-pages/pool/main/${PKG}_"*.deb "gh-pages/pool/main/${PKG}_"*.sha256
            echo "Replaced pool entries for: $PKG"
          done
          echo "Packages that failed to build keep their existing pool entries"

      - name: Update pool
        run: |
          for deb in all-debs/*.deb; do
            [[ -f "$deb" ]] || continue
            fname=$(basename "$deb")
            PKG=$(echo "$fname"  | sed 's/_[^_]*_[^_]*\.deb$//')
            ARCH=$(echo "$fname" | sed 's/.*_\([^_]*\)\.deb$/\1/')
            for old in "gh-pages/pool/main/${PKG}_"*"_${ARCH}.deb"; do
              [[ -f "$old" && "$(basename $old)" != "$fname" ]] && \
                rm -f "$old" "${old}.sha256" && echo "Removed old: $(basename $old)"
            done
            cp "$deb" "gh-pages/pool/main/"
            [[ -f "${deb}.sha256" ]] && cp "${deb}.sha256" "gh-pages/pool/main/"
            echo "Added: $fname"
          done
          echo "Pool total: $(ls gh-pages/pool/main/*.deb 2>/dev/null | wc -l) .deb files"

      - name: Publish checksum-enriched index
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path

          pool = Path("gh-pages/pool/main")
          src = Path("tools/index.json")
          data = json.loads(src.read_text(encoding="utf-8"))
          archs = ["aarch64", "arm", "x86_64", "i686"]
          for entry in data.get("packages", []):
              name = entry["package"]
              version = entry.get("version", "")
              sums = {}
              for arch in archs:
                  sidecar = pool / f"{name}_{version}_{arch}.deb.sha256"
                  if sidecar.is_file():
                      token = sidecar.read_text(encoding="utf-8").split()[0].lower()
                      if len(token) == 64:
                          sums[arch] = token
              if sums:
                  entry["sha256_by_arch"] = sums
          out = Path("gh-pages/tools/index.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding="utf-8")
          EOF

      - name: Generate Packages index and Release
        run: |
          python3 - <<'EOF'
          import hashlib, subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          pool  = Path("gh-pages/pool/main")
          archs = ["aarch64", "arm", "x86_64", "i686"]

          for arch in archs:
              out_dir = Path(f"gh-pages/dists/termux/main/binary-{arch}")
              out_dir.mkdir(parents=True, exist_ok=True)
              entries = []
              for deb in sorted(pool.glob(f"*_{arch}.deb")):
                  def field(f, d=deb):
                      return subprocess.run(["dpkg-deb","-f",str(d),f],
                          capture_output=True, text=True).stdout.strip()
                  data = deb.read_bytes()
                  lines = [
                      f"Package: {field('Package')}",
                      f"Version: {field('Version')}",
                      f"Architecture: {arch}",
                      f"Maintainer: {field('Maintainer')}",
                      f"Installed-Size: {field('Installed-Size')}",
                  ]
                  dep  = field("Depends")
                  home = field("Homepage")
                  if dep:  lines.append(f"Depends: {dep}")
                  if home: lines.append(f"Homepage: {home}")
                  lines += [
                      f"Filename: {deb.relative_to('gh-pages')}",
                      f"Size: {len(data)}",
                      f"MD5sum: {hashlib.md5(data).hexdigest()}",
                      f"SHA1: {hashlib.sha1(data).hexdigest()}",
                      f"SHA256: {hashlib.sha256(data).hexdigest()}",
                      f"Description: {field('Description')}",
                      "",
                  ]
                  entries.append("\n".join(lines))
              pkg_file = out_dir / "Packages"
              pkg_file.write_text("\n".join(entries))
              (out_dir / "Packages.gz").unlink(missing_ok=True)
              subprocess.run(["gzip", "-k", str(pkg_file)])
              print(f"  [{arch}] {len(entries)} packages")

          date_str = datetime.now(timezone.utc).strftime("%a, %d %b %Y %H:%M:%S UTC")
          rel = [
              "Origin: Termux App Store", "Label: Termux App Store",
              "Suite: termux", "Codename: termux", "Components: main",
              f"Architectures: {' '.join(archs)}",
              "Description: Official Termux repository by @djunekz",
              f"Date: {date_str}",
          ]
          for algo in ["MD5Sum", "SHA256"]:
              rel.append(f"{algo}:")
              for arch in archs:
                  for fname in [f"main/binary-{arch}/Packages", f"main/binary-{arch}/Packages.gz"]:
                      p = Path(f"gh-pages/dists/termux/{fname}")
                      if not p.exists(): continue
                      data = p.read_bytes()
                      h = hashlib.md5(data).hexdigest() if algo == "MD5Sum" else hashlib.sha256(data).hexdigest()
                      rel.append(f" {h} {len(data)} {fname}")
          Path("gh-pages/dists/termux/Release").write_text("\n".join(rel) + "\n")
          print("Release file generated")
          EOF

      - name: Sign Release (InRelease + Release.gpg)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash ci/sign_release.sh gh-pages

      - name: Commit and push
        run: |
          cd gh-pages
          git config user.email "258522831+termuxappstore@users.noreply.github.com"
          git config user.name "Termux App Store"
          git add -A
          COUNT=$(ls pool/main/*.deb 2>/dev/null | wc -l || echo 0)
          MSG="pkg: update pool — ${COUNT} .deb files [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git diff --staged --quiet && echo "Nothing to commit" || \
            (git commit -m "$MSG" && git push origin HEAD:gh-pages && echo "Pushed: $MSG")

      - name: Summary
        run: |
          COUNT=$(ls gh-pages/pool/main/*.deb 2>/dev/null | wc -l || echo 0)
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**$COUNT** .deb files in pool" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built natively inside **termux-docker aarch64** — binaries compatible with Termux on Android." >> $GITHUB_STEP_SUMMARY

      - name: Fail the run if any package build failed
        if: always() && needs.build-deb.result != 'success'
        run: |
          echo "At least one package build failed. Packages that built successfully were published; this run is marked failed."
          exit 1
