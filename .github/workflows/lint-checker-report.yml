name: Lint PR Reporter (Label & Comment)

on:
  workflow_run:
    workflows: ["Lint PR Checker"]
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    name: Add label & comment on PR

    steps:
      - name: Download report artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pr-report
          path: /tmp/pr-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Apply labels and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER=$(head -c 20 /tmp/pr-report/pr_number.txt | tr -d '[:space:]')
          OVERALL_STATUS=$(head -c 5 /tmp/pr-report/overall_status.txt | tr -d '[:space:]')

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number in artifact" >&2
            exit 1
          fi
          if [[ "$OVERALL_STATUS" != "0" && "$OVERALL_STATUS" != "1" ]]; then
            echo "Invalid status in artifact" >&2
            exit 1
          fi

          ACTUAL_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ "$ACTUAL_HEAD" != "$RUN_HEAD_SHA" ]]; then
            echo "::notice::Skipping report: PR #$PR_NUMBER head ($ACTUAL_HEAD) differs from the checked commit ($RUN_HEAD_SHA). A newer run will report."
            exit 0
          fi

          gh label create checker-approved --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "Automated lint checks passed" 2>/dev/null || true
          gh label create checker-failed --repo "$GITHUB_REPOSITORY" --color d73a4a --description "Automated lint checks failed" 2>/dev/null || true
          gh label create needs-review --repo "$GITHUB_REPOSITORY" --color fbca04 --description "Waiting for maintainer review" 2>/dev/null || true

          for LABEL in checker-approved checker-failed; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$LABEL" >/dev/null 2>&1 || true
          done

          BODY=/tmp/comment_body.md
          MARKER="<!-- lint-validation -->"

          if [[ "$OVERALL_STATUS" == "0" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
              -f 'labels[]=checker-approved' -f 'labels[]=needs-review' >/dev/null

            {
              echo "$MARKER"
              cat <<'EOF'
          # ✅ Build Script Validation Passed

          Your `build.sh` file(s) have passed all automated checks:

          - ✅ Bash syntax is correct
          - ✅ All required TERMUX_PKG_* variables are defined
          - ✅ SRCURL is valid and reachable
          - ✅ SHA256 checksum verified successfully

          **Label `checker-approved` has been added automatically.**

          Thank you for your contribution! 🎉
          EOF
            } > "$BODY"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
              -f 'labels[]=checker-failed' >/dev/null

            {
              echo "$MARKER"
              echo "# ❌ Build Script Validation Failed"
              echo
              echo 'Your `build.sh` file(s) failed automated validation checks.'
              echo
              head -c 20000 /tmp/pr-report/lint_details.txt
              echo
              echo
              head -c 20000 /tmp/pr-report/validation_details.txt
              echo
              echo
              cat <<'EOF'
          ## 🔧 How to Fix
          1. **Check syntax errors** - Ensure all bash syntax is valid
          2. **Verify SRCURL** - Ensure the URL is correct and accessible
          3. **Update SHA256** - Download the file and compute the correct hash:
             ```bash
             curl -L "YOUR_SRCURL" -o file.tar.gz
             sha256sum file.tar.gz
             ```
          4. **Add required fields**:
             - `TERMUX_PKG_VERSION` (required)
             - `TERMUX_PKG_SRCURL` (required)
             - `TERMUX_PKG_SHA256` (required)
             - `TERMUX_PKG_LICENSE` (recommended)
             - `TERMUX_PKG_HOMEPAGE` (recommended)

          Push new commits to automatically re-run validation.
          EOF
            } > "$BODY"
          fi

          COMMENT_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- lint-validation -->"))) | .id' | head -n1)

          if [[ -n "$COMMENT_ID" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -F body=@"$BODY" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$BODY" >/dev/null
          fi
