name: CLI-Validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  cli-validation:
    name: CLI-Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ github.event_name == 'push' && secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15"

      - name: Make scripts executable
        run: |
          chmod +x termux-build || true
          chmod +x tasctl || true

      - name: Run termux-build validation (Python)
        id: validate
        run: |
          python ci/run_termux_build.py
        continue-on-error: true

      - name: Auto-fix SHA256 mismatches
        if: steps.validate.outcome == 'failure' && github.event_name == 'push'
        id: fix_sha256
        run: |
          echo "Validation failed — checking for SHA256 mismatches..."
          python ci/run_fix_sha256.py
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Re-run validation after SHA256 fix
        if: steps.fix_sha256.outcome == 'success'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Re-running validation after SHA256 fixes..."
          git fetch origin "$REF_NAME"
          git checkout "$REF_NAME"
          git reset --hard "origin/$REF_NAME"
          python ci/run_termux_build.py

      - name: Fail if validation failed on PR
        if: steps.validate.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "Validation failed on PR — please fix manually"
          exit 1
