name: Auto Update Packages

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Nama package dipisah spasi (kosong = cek semua package)'
        required: false
        default: ''
      dry_run:
        description: 'Hanya cek dan tampilkan hasil, tanpa mengubah/commit apa pun'
        required: false
        default: false
        type: boolean
      mode:
        description: 'Cara menyimpan hasil update'
        required: false
        default: 'pull-request'
        type: choice
        options:
          - push
          - pull-request
      include_commit_pinned:
        description: 'Ikut cek package yang dipin ke commit (versi 0.0.0+sha)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-packages
  cancel-in-progress: false

jobs:
  auto-update:
    name: Check upstream and update packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'djunekz/termux-app-store'

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'

      - name: Validate inputs
        env:
          PACKAGES_INPUT: ${{ github.event.inputs.packages }}
        run: |
          if [[ -n "$PACKAGES_INPUT" ]] && ! [[ "$PACKAGES_INPUT" =~ ^[A-Za-z0-9._+,\ -]*$ ]]; then
            echo "Invalid characters in 'packages' input — only letters, numbers, . _ + - , and spaces are allowed" >&2
            exit 1
          fi

      - name: Check upstream and update build.sh + CHANGELOG
        id: update
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGES_INPUT: ${{ github.event.inputs.packages }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          INCLUDE_COMMIT_PINNED: ${{ github.event.inputs.include_commit_pinned }}
          OUT_DIR: ${{ runner.temp }}/auto-update
        run: |
          set -euo pipefail
          PACKAGES="${PACKAGES_INPUT//,/ }"

          args=(--out-dir "$OUT_DIR")
          if [[ "$DRY_RUN" != "true" ]]; then
            args+=(--apply)
          fi
          if [[ "$INCLUDE_COMMIT_PINNED" == "true" ]]; then
            args+=(--include-commit-pinned)
          fi

          python ci/auto_update_packages.py "${args[@]}" $PACKAGES

      - name: Publish summary
        if: always()
        env:
          OUT_DIR: ${{ runner.temp }}/auto-update
        run: |
          if [ -f "$OUT_DIR/summary.md" ]; then
            cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit changes
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REF_NAME: ${{ github.ref_name }}
          OUT_DIR: ${{ runner.temp }}/auto-update
          MODE: ${{ github.event.inputs.mode || 'pull-request' }}
        run: |
          set -euo pipefail

          if [[ "$MODE" == "pull-request" ]]; then
            BRANCH="auto-update/packages"
            if python3 ci/api_commit.py --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" \
              --message-file "$OUT_DIR/commit-message.txt" --reset-branch \
              -- 'packages/*/build.sh' CHANGELOG.md; then
              RC=0
            else
              RC=$?
            fi
            if [ "$RC" -eq 2 ]; then
              exit 0
            fi
            if [ "$RC" -ne 0 ]; then
              exit "$RC"
            fi

            if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
              gh pr create \
                --base "$REF_NAME" \
                --head "$BRANCH" \
                --title "$(head -n 1 "$OUT_DIR/commit-message.txt")" \
                --body-file "$OUT_DIR/summary.md"
            else
              gh pr edit "$BRANCH" \
                --title "$(head -n 1 "$OUT_DIR/commit-message.txt")" \
                --body-file "$OUT_DIR/summary.md"
            fi
            exit 0
          fi

          MAX_RETRIES=3
          RETRY=0
          while [ "$RETRY" -lt "$MAX_RETRIES" ]; do
            if python3 ci/api_commit.py --repo "$GITHUB_REPOSITORY" --branch "$REF_NAME" \
              --message-file "$OUT_DIR/commit-message.txt" -- 'packages/*/build.sh' CHANGELOG.md; then
              exit 0
            else
              RC=$?
            fi
            if [ "$RC" -eq 2 ]; then
              exit 0
            fi
            if [ "$RC" -ne 3 ]; then
              echo "Commit failed (exit code ${RC})"
              exit "$RC"
            fi
            RETRY=$((RETRY + 1))
            echo "Retry $RETRY/$MAX_RETRIES"
            sleep 2
          done
          echo "Commit failed"
          exit 1
