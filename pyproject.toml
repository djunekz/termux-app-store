[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-app-store"
version = "0.9.1"
description = "A local-first TUI and CLI package manager built natively for Termux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "djunekz", email = "gab288.gab288@passinbox.com" }
]
keywords = ["termux", "android", "package-manager", "tui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Software Distribution",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/djunekz/termux-app-store"
Repository = "https://github.com/djunekz/termux-app-store"
"Bug Tracker" = "https://github.com/djunekz/termux-app-store/issues"

[project.scripts]
termux-app-store = "termux_app_store.main:main"
tas = "termux_app_store.main:tas"

[tool.termux-app-store]
tasctl-install-note = "Install tasctl via: bash install.sh  OR  tasctl self-update"

[tool.setuptools.packages.find]
where = ["."]
include = ["termux_app_store*"]

[tool.setuptools.package-data]
termux_app_store = ["data/*.json", "data/build-package.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["termux_app_store", "tools"]

[[tool.mypy.overrides]]
module = ["termux_app_store.*"]
disable_error_code = ["no-redef", "union-attr", "var-annotated", "arg-type", "assignment", "misc", "annotation-unchecked"]

[tool.coverage.run]
source = ["tools", "termux_app_store"]
